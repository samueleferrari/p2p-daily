<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Daily Photo</title>
    <link rel="icon" type="image/x-icon" href="./icons/512.png">
    
    <!-- Manifest link for installation -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Tailwind CSS for base design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    
    <!-- Service Worker registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered successfully!'))
                    .catch(err => console.error('Service Worker error:', err));
            });
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight text-black">P2P Daily</h1>
            <div id="user-badge" class="hidden flex items-center gap-4">
                <!-- Privacy Toggle -->
                <label class="flex items-center cursor-pointer">
                    <span class="mr-2 text-xs font-semibold text-gray-600">Private Account</span>
                    <input type="checkbox" id="privacy-toggle" onchange="togglePrivacy()" class="sr-only peer">
                    <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-black relative"></div>
                </label>
                <!-- User Badge -->
                <div class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">
                    User: <span class="font-mono font-bold text-black ml-1">@<span id="my-peer-id">...</span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- REGISTRATION SCREEN -->
    <section id="registration-section" class="max-w-xl mx-auto mt-20 px-4">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center">
            <h2 class="text-2xl font-bold mb-2">Choose your Username</h2>
            <p class="text-gray-500 mb-6 text-sm">This name will identify your device on the P2P network.</p>
            <input id="new-username-input" type="text" placeholder="e.g. mark99" class="w-full px-4 py-3 mb-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg">
            <button onclick="registerDevice()" class="w-full bg-black text-white px-6 py-3 rounded-xl font-medium hover:bg-gray-800 transition">
                Join the network
            </button>
        </div>
    </section>

    <!-- MAIN APP (Hidden by default) -->
    <main id="main-app-section" class="hidden max-w-xl mx-auto mt-6 px-4 space-y-8">

        <!-- Section: My photo of the day -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-4">Your photo of the day</h2>
            
            <div id="upload-section" class="hidden">
                <label for="photo-upload" class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition">
                    <span class="text-gray-500 font-medium">Tap to take or upload</span>
                    <span class="text-xs text-gray-400 mt-1">Max 1 per day</span>
                    <input id="photo-upload" type="file" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
                </label>
            </div>

            <div id="my-photo-display" class="hidden flex flex-col items-center">
                <img id="my-photo-img" src="" alt="My photo of the day" class="w-full max-w-sm rounded-lg shadow-md object-cover">
                <p class="text-sm text-green-600 mt-3 font-medium flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </p>
            </div>
        </section>

        <!-- Section: Your Friends -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold mb-2">Your friends</h2>
            <p class="text-sm text-gray-500 mb-4">Add friends to your local address book. Their feed will be synced automatically.</p>
            
            <div class="flex gap-2 mb-6">
                <input id="add-friend-input" type="text" placeholder="E.g. luke99..." class="flex-1 px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="manualAddFriend()" class="bg-black text-white px-6 py-2 rounded-xl font-medium hover:bg-gray-800 transition">Add</button>
            </div>

            <div id="friends-list" class="space-y-2">
                <!-- Friends list will appear here, without "Connect" buttons -->
            </div>
        </section>

        <!-- Section: Allowed people (Visible only if Private) -->
        <section id="allowed-section" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mt-6 hidden">
            <h2 class="text-lg font-semibold mb-4 text-blue-600">Allowed people</h2>
            <div id="followers-list" class="space-y-2">
                <!-- Authorized people will appear here -->
            </div>
        </section>

        <!-- Section: Follow Requests (Visible only if Private) -->
        <section id="requests-section" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 hidden">
            <h2 class="text-lg font-semibold mb-4 text-orange-600">Pending requests</h2>
            <div id="requests-list" class="space-y-2">
                <!-- Requests will appear here -->
            </div>
        </section>

        <!-- Section: Timeline (P2P Feed) -->
        <section>
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="text-lg font-semibold">P2P Timeline</h2>
                <button onclick="syncFeed()" class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-200 transition flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Sync
                </button>
            </div>
            <div id="timeline" class="space-y-6">
                <!-- The feed rendered from localStorage will appear here -->
            </div>
        </section>

    </main>

    <!-- Toast -->
    <div id="toast" class="toast fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium opacity-0 pointer-events-none z-50">
        System message
    </div>

    <script src="script.js"></script>
</body>
</html>
